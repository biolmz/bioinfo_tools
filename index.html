<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioNav · 生物信息学工具导航</title>
<meta name="description" content="生物信息学常用工具与数据库导航：序列比对、基因组数据库、多组学、蛋白结构、系统发育、单细胞、分子对接与学习资源。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%233f51b5'/%3E%3Cpath d='M22 8c0 14 20 18 20 24s-20 10-20 24M42 8c0 14-20 18-20 24s20 10 20 24' stroke='%23ffffff' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Cline x1='24' y1='19' x2='40' y2='19' stroke='%23c5cae9' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='25' y1='32' x2='39' y2='32' stroke='%23c5cae9' stroke-width='3' stroke-linecap='round'/%3E%3Cline x1='24' y1='45' x2='40' y2='45' stroke='%23c5cae9' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --indigo:#3f51b5; --indigo-d:#303f9f; --indigo-l:#e8eaf6; --indigo-2:#5f71cc;
    --page:#eeeeee; --paper:#ffffff;
    --line:#e0e0e0; --line-2:#cfcfcf;
    --ink:#212121; --ink-2:#424242; --muted:#757575; --faint:#9e9e9e;
    --red:#d32f2f; --amber:#ef6c00; --green:#2e7d32;
    --sans:"Roboto","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:"Roboto Mono","JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
    --sh1:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);
    --sh2:0 3px 6px rgba(0,0,0,.14),0 2px 4px rgba(0,0,0,.10);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--indigo);text-decoration:none}
  .mono{font-family:var(--mono)}

  header{background:var(--indigo);color:#fff;padding:20px 24px;box-shadow:var(--sh2)}
  header .wrap{max-width:1080px;margin:0 auto}
  header h1{margin:0;font-size:20px;font-weight:500;letter-spacing:.5px}
  header p{margin:4px 0 0;font-size:12.5px;opacity:.85}

  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}

  .toolbar{position:sticky;top:0;z-index:10;background:var(--paper);box-shadow:var(--sh1);margin-top:-0px;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .toolbar .inner{max-width:1080px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;width:100%}
  #q{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--line-2);border-radius:3px;font-size:13.5px;font-family:inherit;outline:none}
  #q:focus{border-color:var(--indigo)}
  .count{font-size:12px;color:var(--muted);white-space:nowrap}

  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0 2px}
  .chip{padding:5px 12px;border:1px solid var(--line-2);border-radius:16px;background:var(--paper);cursor:pointer;font-size:12.5px;color:var(--ink-2);user-select:none}
  .chip:hover{border-color:var(--indigo);color:var(--indigo)}
  .chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff}

  main{padding:8px 0 48px}
  section.cat{margin-top:22px}
  section.cat h2{font-size:14px;font-weight:600;margin:0 0 4px;display:flex;align-items:baseline;gap:8px}
  section.cat h2 .no{color:var(--indigo);font-family:var(--mono);font-size:12px}
  section.cat .desc{font-size:12px;color:var(--muted);margin:0 0 10px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .card{display:block;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:12px 14px;box-shadow:var(--sh1);transition:box-shadow .15s,border-color .15s}
  a.card:hover{text-decoration:none;border-color:var(--indigo);box-shadow:var(--sh2)}
  .card .t{font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .card .t .host{font-family:var(--mono);font-size:10.5px;color:var(--faint);font-weight:400}
  .card .d{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.55}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:2px;background:var(--indigo-l);color:var(--indigo-d);font-weight:500}
  .tag.hot{background:#ffebee;color:var(--red)}
  .tag.local{background:#e8f5e9;color:var(--green)}

  .empty{padding:40px 0;text-align:center;color:var(--faint);font-size:13px;display:none}

  footer{border-top:1px solid var(--line);padding:16px;text-align:center;font-size:12px;color:var(--faint);background:var(--paper)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>BioNav · 生物信息学工具导航</h1>
    <p>常用数据库 · 分析平台 · 在线工具 · 计算替代方案，一键直达。数据均为公开站点，全部链接新窗口打开。</p>
  </div>
</header>

<div class="toolbar">
  <div class="inner">
    <input id="q" type="search" placeholder="搜索工具 / 关键词，如 blast、geo、对接、单细胞…" autocomplete="off">
    <span class="count" id="count"></span>
  </div>
</div>

<main class="wrap">
  <div class="chips" id="chips"></div>
  <div id="cats"></div>
  <div class="empty" id="empty">没有匹配的工具，换个关键词试试。</div>
</main>

<footer>BioNav · 静态单文件，可离线保存 · 收录公开生信资源</footer>

const catsEl = document.getElementById('cats');
const chipsEl = document.getElementById('chips');
const qEl = document.getElementById('q');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
let activeCat = null;

function host(u){ try{ return new URL(u, location.href).hostname || '本地'; }catch(e){ return '本地'; } }

function renderChips(){
  const mk = (label, val) => {
    const c = document.createElement('span');
    c.className = 'chip' + (activeCat===val ? ' on':'');
    c.textContent = label;
    c.onclick = () => { activeCat = (activeCat===val ? null : val); renderAll(); };
    return c;
  };
  chipsEl.innerHTML = '';
  chipsEl.appendChild(mk('全部', null));
  DATA.forEach(cat => chipsEl.appendChild(mk(cat.no + ' ' + cat.name, cat.name)));
}

function renderCats(){
  const q = qEl.value.trim().toLowerCase();
  catsEl.innerHTML = '';
  let shown = 0;
  DATA.forEach(cat => {
    if (activeCat && cat.name !== activeCat) return;
    const tools = cat.tools.filter(t => !q ||
      (t.n + ' ' + t.d + ' ' + cat.name).toLowerCase().includes(q));
    if (!tools.length) return;
    shown += tools.length;
    const sec = document.createElement('section');
    sec.className = 'cat';
    sec.innerHTML = '<h2><span class="no">' + cat.no + '</span>' + cat.name +
      '</h2><p class="desc">' + cat.desc + '（' + tools.length + '）</p>';
    const grid = document.createElement('div');
    grid.className = 'grid';
    tools.forEach(t => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = t.u; a.target = '_blank'; a.rel = 'noopener';
      let tags = '';
      (t.t||[]).forEach(x => {
        const cls = x==='常用' ? 'tag hot' : (x==='本地' ? 'tag local' : 'tag');
        tags += '<span class="' + cls + '">' + x + '</span>';
      });
      a.innerHTML = '<div class="t">' + t.n + ' ' + tags +
        '<span class="host">' + host(t.u) + '</span></div>' +
        '<div class="d">' + t.d + '</div>';
      grid.appendChild(a);
    });
    sec.appendChild(grid);
    catsEl.appendChild(sec);
  });
  emptyEl.style.display = shown ? 'none' : 'block';
  countEl.textContent = shown + ' 个工具';
}

function renderAll(){ renderChips(); renderCats(); }
